<app-titlebar />

<main class="page">
  <section class="card">
    <div class="logos">
      <a href="https://tauri.app" target="_blank" rel="noopener">
        <img src="/assets/tauri.svg" class="logo" alt="Logo Tauri" />
      </a>
      <a href="https://angular.io" target="_blank" rel="noopener">
        <img src="/assets/angular.svg" class="logo" alt="Logo Angular" />
      </a>
    </div>

    <p class="eyebrow">Tauri + Angular + Rust</p>
    <h1>Bienvenue sur Inkly</h1>
    <p class="subtitle">Le backend Rust répond via une commande Tauri.</p>

    <form class="greet-row" (submit)="greet($event, greetInput.value)">
      <input #greetInput id="greet-input" placeholder="Entrez un nom…" autocomplete="off" />
      <button type="submit">Saluer</button>
    </form>
    <p class="greeting">{{ greetingMessage() }}</p>

    <router-outlet />
  </section>
</main>
