<header class="titlebar" data-tauri-drag-region>
  <div class="brand" data-tauri-drag-region (dblclick)="toggleMaximize()">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name" data-tauri-drag-region>Inkly</span>
  </div>

  @if (isTauri()) {
    <!-- Icônes Lucide (lucide.dev), licence ISC : usage commercial autorisé, sans attribution requise. -->
    <div class="controls">
      <button type="button" class="ctl" (click)="minimize()" aria-label="Réduire" title="Réduire">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14" />
        </svg>
      </button>
      <button
        type="button"
        class="ctl"
        (click)="toggleMaximize()"
        [attr.aria-label]="isMaximized() ? 'Restaurer' : 'Agrandir'"
        [title]="isMaximized() ? 'Restaurer' : 'Agrandir'"
      >
        @if (isMaximized()) {
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
          </svg>
        } @else {
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="18" height="18" x="3" y="3" rx="2" />
          </svg>
        }
      </button>
      <button type="button" class="ctl close" (click)="close()" aria-label="Fermer" title="Fermer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </div>
  }
</header>
