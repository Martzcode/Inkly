<header class="titlebar" data-tauri-drag-region>
  <div class="brand" data-tauri-drag-region (dblclick)="toggleMaximize()">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name" data-tauri-drag-region>Inkly</span>
  </div>

  <button
    type="button"
    class="theme-toggle"
    (click)="theme.toggle()"
    [attr.aria-label]="theme.theme() === 'light' ? i18n.t('theme.toDark') : i18n.t('theme.toLight')"
    [attr.title]="theme.theme() === 'light' ? i18n.t('theme.toDark') : i18n.t('theme.toLight')"
  >
    @if (theme.theme() === 'light') {
      <svg lucideMoon [size]="15" aria-hidden="true"></svg>
    } @else {
      <svg lucideSun [size]="15" aria-hidden="true"></svg>
    }
  </button>

  <div class="spacer" data-tauri-drag-region></div>

  @if (isTauri()) {
    <div class="controls">
      <button type="button" class="ctl" (click)="minimize()" [attr.aria-label]="i18n.t('titlebar.minimize')" [attr.title]="i18n.t('titlebar.minimize')">
        <svg lucideMinus [size]="14" aria-hidden="true"></svg>
      </button>
      <button
        type="button"
        class="ctl"
        (click)="toggleMaximize()"
        [attr.aria-label]="isMaximized() ? i18n.t('titlebar.restore') : i18n.t('titlebar.maximize')"
        [attr.title]="isMaximized() ? i18n.t('titlebar.restore') : i18n.t('titlebar.maximize')"
      >
        @if (isMaximized()) {
          <svg lucideCopy [size]="14" aria-hidden="true"></svg>
        } @else {
          <svg lucideSquare [size]="14" aria-hidden="true"></svg>
        }
      </button>
      <button type="button" class="ctl close" (click)="close()" [attr.aria-label]="i18n.t('titlebar.close')" [attr.title]="i18n.t('titlebar.close')">
        <svg lucideX [size]="14" aria-hidden="true"></svg>
      </button>
    </div>
  }
</header>
