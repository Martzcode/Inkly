<!-- Infobulle NATIVE (title) : les infobulles CSS custom rendent mal
     dans WebKitGTK (boîte sans texte, reste bloquée visible). Ne pas
     réintroduire de tooltip custom sans tester dans la vraie fenêtre Tauri. -->
<nav class="sidebar" aria-label="Navigation principale">
  <div class="group">
    @for (item of mainItems(); track item.route) {
      <a
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        [attr.aria-label]="item.label"
        [attr.title]="item.label"
      >
        <svg [lucideIcon]="item.icon" [size]="20" aria-hidden="true"></svg>
      </a>
    }
    @if (boardVisible) {
      <a
        class="nav-item"
        routerLink="/board"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        [attr.aria-label]="boardLabel()"
        [attr.title]="boardLabel()"
      >
        <svg [lucideIcon]="boardIcon" [size]="20" aria-hidden="true"></svg>
      </a>
    }
  </div>

  <div class="spacer"></div>

  <div class="group">
    @for (item of bottomItems(); track item.route) {
      <a
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        [attr.aria-label]="item.label"
        [attr.title]="item.label"
      >
        <svg [lucideIcon]="item.icon" [size]="20" aria-hidden="true"></svg>
      </a>
    }
  </div>
</nav>
