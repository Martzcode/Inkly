<section class="panel">
  <h2>{{ i18n.t('settings.title') }}</h2>

  <div class="row">
    <label for="lang-select">{{ i18n.t('settings.language') }}</label>
    <select
      id="lang-select"
      [value]="i18n.lang()"
      (change)="i18n.setLang($any($event.target).value)"
    >
      @for (lang of langs; track lang) {
        <option [value]="lang" [selected]="lang === i18n.lang()">{{ langName(lang) }}</option>
      }
    </select>
  </div>
  <p class="muted">{{ i18n.t('settings.languageHint') }}</p>
</section>
